<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Matrícula</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<form name="matricula" class="form-moderno">

    <div class="sessao">
        <h3 class="titulo-sessao">Dados do Aluno</h3>
        
        <div class="linha">
            <input type="text" placeholder="Nome:" style="flex: 1;">
        </div>
        
        <div class="linha">
            <input type="text" placeholder="Endereço:" style="flex: 3;">
            <input type="text" placeholder="Complemento:" style="flex: 1;">
        </div>
        
        <div class="linha">
            <input type="text" placeholder="Cidade:" style="flex: 2;">
            <input type="text" placeholder="Bairro:" style="flex: 2;">
            <input type="text" placeholder="CEP:" style="flex: 1.5;" maxlength="9" oninput="mascaraCEP(this)">
            <input type="text" placeholder="Estado:" style="flex: 1;">
            <input type="date" style="flex: 1.5;">
        </div>
        
        <div class="linha">
            <input type="text" placeholder="Profissão:" style="flex: 2;">
            <input type="email" placeholder="Email:" style="flex: 2;">
            <input type="text" placeholder="Whatsapp:" style="flex: 1.5;" maxlength="15" oninput="mascaraTelefone(this)">
        </div>
        
        <div class="linha">
            <input type="text" placeholder="Escolaridade:" style="flex: 2;">
            <div class="opcoes-inline" style="flex: 1.5;">
                <strong>Sexo:</strong>
                <label><input type="radio" name="sexo"> Masc</label>
                <label><input type="radio" name="sexo"> Fem</label>
            </div>
            <input type="text" placeholder="RG:" style="flex: 1.5;" maxlength="12" oninput="mascaraRG(this)">
            <input type="text" placeholder="Telefone Comercial:" style="flex: 2;" maxlength="15" oninput="mascaraTelefone(this)">
        </div>

        <div class="linha">
            <input type="text" placeholder="Medicação:" style="flex: 2;">
            <select style="flex: 1.5;">
                <option>Estado Civil</option>
                <option>Solteiro(a)</option>
                <option>Casado(a)</option>
                <option>Divorciado(a)</option>
                <option>Viúvo(a)</option>
                <option>União Estável</option>
            </select>
            <input type="text" placeholder="CPF:" style="flex: 1.5;" maxlength="14" oninput="mascaraCPF(this)">
        </div>
    </div>

    <div class="sessao">
        <h3 class="titulo-sessao">Responsável Financeiro</h3>
        
        <div class="linha">
            <input type="text" placeholder="Nome:" style="flex: 1;">
        </div>
        
        <div class="linha">
            <input type="text" placeholder="Endereço:" style="flex: 3;">
            <input type="text" placeholder="Complemento:" style="flex: 1;">
        </div>
        
        <div class="linha">
            <input type="text" placeholder="Cidade:" style="flex: 2;">
            <input type="text" placeholder="Bairro:" style="flex: 2;">
            <input type="text" placeholder="CEP:" style="flex: 1.5;" maxlength="9" oninput="mascaraCEP(this)">
            <input type="text" placeholder="Estado:" style="flex: 1;">
            <input type="date" style="flex: 1.5;">
        </div>
        
        <div class="linha">
            <input type="text" placeholder="Profissão:" style="flex: 2;">
            <input type="email" placeholder="Email:" style="flex: 2;">
            <input type="text" placeholder="Telefone Residencial:" style="flex: 1.5;" maxlength="15" oninput="mascaraTelefone(this)">
        </div>
        
        <div class="linha">
            <input type="text" placeholder="Escolaridade:" style="flex: 2;">
            <div class="opcoes-inline" style="flex: 1.5;">
                <strong>Sexo:</strong>
                <label><input type="radio" name="sexo2"> Masc</label>
                <label><input type="radio" name="sexo2"> Fem</label>
            </div>
            <input type="text" placeholder="RG:" style="flex: 1.5;" maxlength="12" oninput="mascaraRG(this)">
            <input type="text" placeholder="Telefone Comercial:" style="flex: 2;" maxlength="15" oninput="mascaraTelefone(this)">
        </div>

        <div class="linha">
            <input type="text" placeholder="CPF/CNPJ:" style="flex: 2;" maxlength="14" oninput="mascaraCPF(this)">
            <select style="flex: 1.5;">
                <option>Estado Civil</option>
                <option>Solteiro(a)</option>
                <option>Casado(a)</option>
                <option>Divorciado(a)</option>
                <option>Viúvo(a)</option>
                <option>União Estável</option>
            </select>
            <input type="text" placeholder="Cargo:" style="flex: 2;">
        </div>

        <div class="linha">
            <div class="opcoes-inline">
                <strong>Tipo de Pessoa:</strong>
                <label><input type="radio" name="Pessoa"> Física</label>
                <label><input type="radio" name="Pessoa"> Jurídica</label>
            </div>
        </div>
    </div>

    <div class="sessao">
        <h3 class="titulo-sessao">Investimento Educacional</h3>
        
        <div class="linha">
            <input type="text" placeholder="Taxa de Matrícula:" style="flex: 1;">
            <input type="text" placeholder="Taxa do Material WEB:" style="flex: 1.5;">
            <input type="text" placeholder="Valor das Parcelas:" style="flex: 1;">
            <input type="text" placeholder="Número de Parcelas:" style="flex: 1;">
        </div>
        
        <div class="linha">
            <div class="opcoes-inline" style="flex: 1;">
                <strong>Vencimento:</strong>
                <label><input type="radio" name="Vencimento"> 10</label>
                <label><input type="radio" name="Vencimento"> 20</label>
            </div>
            <input type="text" placeholder="Duração do Curso:" style="flex: 3;">
        </div>
    </div>

    <div class="sessao">
        <h3 class="titulo-sessao">Dados do Curso</h3>
        
        <div class="linha alinha-topo">
            <div class="bloco-label" style="flex: 2;">
                <label>Curso</label>
                <input type="text">
            </div>
            <div class="bloco-label" style="flex: 2;">
                <label>Turma</label>
                <input type="text">
            </div>
            <div class="bloco-label" style="flex: 1.5;">
                <label>Turno</label>
                <select>
                    <option>Selecione</option>
                    <option>Manhã</option>
                    <option>Tarde</option>
                    <option>Noite</option>
                </select>
            </div>
            <div class="bloco-label" style="flex: 1.5;">
                <label>Início</label>
                <input type="date">
            </div>
            <div class="bloco-label" style="flex: 1.5;">
                <label>Término</label>
                <input type="date">
            </div>
        </div>

        <div class="linha alinha-topo">
            <div class="bloco-label" style="flex: 1;">
                <label>Carga Horária</label>
                <input type="text">
            </div>
            <div class="bloco-label" style="flex: 1;">
                <label>Sala</label>
                <input type="text">
            </div>
        </div>

        <div class="linha alinhar-cantos">
            <div class="opcoes-inline">
                <strong>Dias:</strong>
                <label><input type="checkbox"> Seg</label>
                <label><input type="checkbox"> Ter</label>
                <label><input type="checkbox"> Qua</label>
                <label><input type="checkbox"> Qui</label>
                <label><input type="checkbox"> Sex</label>
                <label><input type="checkbox"> Sab</label>
            </div>
            <div class="opcoes-inline">
                <strong>Horário:</strong>
                <input type="time" style="width: auto;"> às <input type="time" style="width: auto;">
            </div>
        </div>

        <div class="linha">
            <input type="text" placeholder="Assinatura Primeira Aula:" style="flex: 1;">
        </div>

        <div class="linha">
            <input type="text" placeholder="Contratante" style="flex: 1;">
            <input type="text" placeholder="Contratada" style="flex: 1;">
            <input type="date" style="flex: 1;">
        </div>
    </div>

    <div class="buttons">
        <input type="submit" value="Cadastrar">
        <input type="reset" value="Limpar">
    </div>

</form>

<script src="JS/script.js"></script>
</body>
</html>
